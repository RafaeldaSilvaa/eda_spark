[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-eda"
version = "0.1.0"
description = "Distributed Exploratory Data Analysis and Data Quality Assessment for PySpark"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "spark_eda contributors"},
]
keywords = ["spark", "pyspark", "eda", "data-quality", "exploratory-data-analysis", "big-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pyspark>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/usuario/spark-eda"
Repository = "https://github.com/usuario/spark-eda"
Documentation = "https://github.com/usuario/spark-eda#readme"
Tracker = "https://github.com/usuario/spark-eda/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "mypy>=1.15",
    "ruff>=0.11",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "faker>=22.0",
]
benchmark = [
    "pytest-benchmark>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spark_eda*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PTH", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "PLR2004", "PLC0415"]
"notebooks/**" = ["E402", "E501", "PLR2004", "N812", "I001"]
"scripts/**" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = ["error"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (requires Spark session)",
    "contract: marks tests as contract/schema tests",
    "benchmark: marks tests as benchmark tests",
    "slow: marks tests as slow (excluded from default run)",
]

[tool.coverage.run]
source = ["spark_eda"]
branch = true
command_line = "-m pytest"

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]