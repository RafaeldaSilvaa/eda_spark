# openspec/config.yaml
schema: spec-driven

context: |
  Project: spark-eda
  Stack: Python 3.12+ · PySpark 4.x
  Architecture: Clean Architecture (hexagonal) — domain/application/adapters/framework
  Testing: pytest 8+ with unit/integration/contract markers
  Style: ruff (line-length 120, py314 target) + mypy strict
  Status: Active library — 433 unit tests passing, ruff 0 warnings, mypy 0 errors
  CI: GitHub Actions (test.yml — lint + unit tests on push/PR)

strict_tdd: false

testing:
  test_runner:
    detected: true
    reason: "pytest 8+ configured in pyproject.toml with unit/integration/contract/benchmark/slow markers"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: "pytest --cov --cov-report=term --cov-report=xml"
    threshold: 95
  quality:
    linter: true
    type_checker: true
    formatter: true

rules:
  proposal:
    - Define scope and expected artifacts
    - Consider Spark compatibility and data volume assumptions
  specs:
    - Use Given/When/Then for scenarios where applicable
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Follow Clean Architecture patterns (domain → application → adapters → framework)
    - Prefer immutable DTOs with _replace() for partial updates
    - Use Severity enum for quality factor thresholds
    - Centralize shared logic in __init__.py of each layer
  tasks:
    - Group by architectural layer (domain, application, adapters, framework)
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Run ruff and mypy before committing
    tdd: false
    test_command: "pytest -m \"not integration and not slow and not benchmark\""
  verify:
    test_command: "pytest -m \"not integration and not slow and not benchmark\" --cov --cov-report=term"
    build_command: ""
    coverage_threshold: 95
  archive:
    - Warn before merging destructive deltas
