x-spark-env: &spark-env
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  PYSPARK_PYTHON: python3
  PYSPARK_DRIVER_PYTHON: python3

services:
  test:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: spark-eda:test
    container_name: spark-eda-test
    environment:
      <<: *spark-env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./README.md:/app/README.md
    command: ["pytest", "tests/", "--cov=spark_eda", "--cov-fail-under=95", "-v"]

  shell:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: spark-eda:shell
    container_name: spark-eda-shell
    environment:
      <<: *spark-env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./README.md:/app/README.md
      - ./data:/app/data
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    image: spark-eda:jupyter
    container_name: spark-eda-jupyter
    environment:
      <<: *spark-env
      SPARK_LOCAL_IP: 127.0.0.1
    ports:
      - "8888:8888"
    volumes:
      - ./src:/home/jovyan/work/src
      - ./notebooks:/home/jovyan/work/notebooks
      - ./data:/home/jovyan/work/data
      - ./pyproject.toml:/home/jovyan/work/pyproject.toml
      - ./README.md:/home/jovyan/work/README.md
      - ./LICENSE:/home/jovyan/work/LICENSE
      - ./tests:/home/jovyan/work/tests
    stdin_open: true
    tty: true

  benchmark:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: spark-eda:benchmark
    container_name: spark-eda-benchmark
    environment:
      <<: *spark-env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./README.md:/app/README.md
      - ./bench_results:/app/bench_results
    command: >
      pytest tests/ --benchmark-only --benchmark-json=bench_results/benchmark.json
    profiles:
      - benchmark
